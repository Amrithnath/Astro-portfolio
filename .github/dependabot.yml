version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    commit-message:
      prefix: 'build'
    ignore:
      # astro check rejects TypeScript 7; revisit once @astrojs/check supports it.
      - dependency-name: typescript
        versions: ['>=7']
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    commit-message:
      prefix: 'ci'
    groups:
      actions:
        patterns: ['*']
