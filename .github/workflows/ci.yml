name: Portfolio Quality

# Fail fast, fail all. The gates run in parallel: Conventions, CodeQL, Build and Node 24 start
# together; e2e and Lighthouse start as soon as Build has uploaded dist/. A failing gate cancels the
# whole run, and deploys only start once every gate has passed.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '27 3 * * 1' # weekly CodeQL scan
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  conventions:
    name: Conventions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      # Sveltia CMS opens cms/* PRs with its own titles (e.g. "WIP: …"); their commits are still linted.
      - name: PR title
        if: ${{ !startsWith(github.head_ref, 'cms/') }}
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            security
            style
            test
          subjectPattern: '^(?:✨|🐛|⚡|🔒|♻️?|📝|👷|📦|⬆️?|🔀|🔧|💄|✅|⏪|💥)\s+.+$'
          subjectPatternError: 'Start the subject with an emoji, e.g. "✨ add a feature".'
          ignoreLabels: 'autorelease: pending'
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Commit messages
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
      - name: Cancel the run on failure
        if: failure()
        run: gh run cancel "$RUN_ID" --repo "$REPO"
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
      security-events: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: actions, javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          output: sarif-results
          upload: never # GitHub default setup publishes alerts; this run only gates the pipeline
      - name: Fail on findings
        run: node scripts/check-codeql-sarif.mjs sarif-results
      - name: Cancel the run on failure
        if: failure()
        run: gh run cancel "$RUN_ID" --repo "$REPO"
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}

  build:
    name: Build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - run: pnpm check
      - run: pnpm build
        env:
          PUBLIC_CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
      - run: pnpm check:seo && pnpm check:theme && pnpm check:links && pnpm check:headers && pnpm check:photos
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 3
      - name: Cancel the run on failure
        if: failure()
        run: gh run cancel "$RUN_ID" --repo "$REPO"
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}

  node-24:
    name: Node 24
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Cancel the run on failure
        if: failure()
        run: gh run cancel "$RUN_ID" --repo "$REPO"
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}

  e2e:
    name: E2E
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      # ubuntu-latest ships Google Chrome with its dependencies; skip the slow Playwright download.
      - run: pnpm test:e2e
        env:
          PLAYWRIGHT_CHANNEL: chrome
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
      - name: Cancel the run on failure
        if: failure()
        run: gh run cancel "$RUN_ID" --repo "$REPO"
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}

  lighthouse:
    name: Lighthouse (${{ matrix.profile }} ${{ matrix.shard }}/2)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
    strategy:
      matrix:
        profile: [mobile, desktop]
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - run: pnpm lighthouse
        env:
          LIGHTHOUSE_DESKTOP: ${{ matrix.profile == 'desktop' && '1' || '0' }}
          LIGHTHOUSE_SHARD: ${{ matrix.shard }}/2
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-${{ matrix.profile }}-${{ matrix.shard }}
          path: .lighthouseci/
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Cancel the run on failure
        if: failure()
        run: gh run cancel "$RUN_ID" --repo "$REPO"
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}

  deploy-pages:
    name: Deploy (GitHub Pages)
    needs: [conventions, codeql, build, node-24, e2e, lighthouse]
    # Conventions is skipped on push, so require "no failures" rather than "all succeeded".
    if: ${{ !cancelled() && !failure() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5

  # Cloudflare and Vercel deploy here, after all gates, instead of from their Git integrations.
  # Each job skips itself until its secrets are added.
  deploy-cloudflare:
    name: Deploy (Cloudflare)
    needs: [conventions, codeql, build, node-24, e2e, lighthouse]
    if: ${{ !cancelled() && !failure() && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'portfolio' }}
      PAGES_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Cloudflare secrets not set; skipping."
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: >-
          npx -y wrangler@4 pages deploy dist
          --project-name="$PAGES_PROJECT"
          --branch="$PAGES_BRANCH"

  deploy-vercel:
    name: Deploy (Vercel)
    needs: [conventions, codeql, build, node-24, e2e, lighthouse]
    if: ${{ !cancelled() && !failure() && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - if: env.VERCEL_TOKEN == ''
        run: echo "::notice::Vercel secrets not set; skipping."
      - if: env.VERCEL_TOKEN != ''
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: .vercel/output/static
      - if: env.VERCEL_TOKEN != ''
        run: |
          echo '{"version":3}' > .vercel/output/config.json
          npx -y vercel@latest deploy --prebuilt --token="$VERCEL_TOKEN" ${{ github.ref == 'refs/heads/main' && '--prod' || '' }}
