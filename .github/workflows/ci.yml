name: Portfolio Quality

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Astro and TypeScript
        run: pnpm check
      - name: Build static site
        run: pnpm build
      - name: Check built SEO and theme contracts
        run: pnpm check:seo && pnpm check:theme
      - name: Audit production dependencies
        run: pnpm audit --prod
      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: pnpm test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
