name: Build and deploy site to various hosting providers
on:
  workflow_dispatch:
    inputs:
      name:
        description: "enter the environment to redeploy, enter 1 for github and 2 for GCP"
        default : "1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
        env:
          PUBLIC_CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
          PUBLIC_VIEWS_URL: ${{ vars.VIEWS_URL }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.sha }}-dist
          path: dist
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy-ghpages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  deploy-gcloud-storage:
    if: inputs.name == '2' # only deploy to gcloud if the input is 2
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ github.sha }}-dist
          path: './dist'
      - uses: 'google-github-actions/auth@v3'
        with:
          workload_identity_provider: ${{ vars.GCP_WORKFLOW_ID_PROVIDER_ID }}
          service_account: ${{ vars.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
      - uses: 'google-github-actions/upload-cloud-storage@v3'
        with:
          path: './dist'
          destination: ${{ vars.GCLOUD_BUCKET }}
          parent: false
