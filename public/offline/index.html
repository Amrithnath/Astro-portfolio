<!doctype html>
<html lang="en" data-theme="terminal">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Offline | Amrithnath Vijayakumar</title>
    <meta name="theme-color" content="#1e1e2e" />
    <style>
      /* Inline snapshot of src/styles/themes/terminal.css + tokens.css (static page, no bundler). */
      [data-theme="terminal"] {
        color-scheme: dark;
        --color-bg: #1e1e2e;
        --color-text: #cdd6f4;
        --color-muted: #9399b2;
        --color-accent: #a6e3a1;
        --color-link: #89b4fa;
        --font-mono: 'JetBrains Mono', 'Fira Code', 'Consolas', 'Courier New', monospace;
        --space-2: 0.5rem;
        --space-6: 2rem;
        --text-base: 0.875rem;
        --leading-normal: 1.5;
        --content-width: 72ch;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--color-bg);
        color: var(--color-text);
        font-family: var(--font-mono);
        font-size: var(--text-base);
        line-height: var(--leading-normal);
      }
      main {
        padding: var(--space-6);
        max-width: var(--content-width);
      }
      .prompt {
        color: var(--color-accent);
      }
      a {
        color: var(--color-link);
      }
      a:hover,
      a:focus-visible {
        color: var(--color-accent);
      }
    </style>
  </head>
  <body>
    <main>
      <p><span class="prompt">~/portfolio $</span> curl https://amrithnath.dev</p>
      <p>curl: (6) Could not resolve host: you appear to be offline.</p>
      <p>Check your connection and <a href="/">try again</a>.</p>
    </main>
  </body>
</html>
