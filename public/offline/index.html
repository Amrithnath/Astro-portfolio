<!doctype html>
<html lang="en" data-theme="terminal">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Offline | Amrithnath Vijayakumar</title>
    <meta name="theme-color" content="#1e1e2e" />
    <style>
      [data-theme="terminal"] {
        color-scheme: dark;
        --color-bg: #1e1e2e;
        --color-text: #cdd6f4;
        --color-accent: #89b4fa;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--color-bg);
        color: var(--color-text);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      main {
        padding: 2rem;
        max-width: 36rem;
      }
      .prompt {
        color: var(--color-accent);
      }
      a {
        color: #7ee787;
      }
    </style>
  </head>
  <body>
    <main>
      <p><span class="prompt">~/portfolio $</span> curl https://amrithnath.dev</p>
      <p>curl: (6) Could not resolve host: you appear to be offline.</p>
      <p>Check your connection and <a href="/">try again</a>.</p>
    </main>
  </body>
</html>
