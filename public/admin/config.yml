# Sveltia CMS configuration for /admin. https://sveltiacms.app/en/docs
# Every save opens (or updates) a pull request on a cms/<collection>/<slug> branch, so the full CI
# pipeline and preview deploys run before anything reaches main.
backend:
  name: github
  repo: Amrithnath/Astro-portfolio
  branch: main
  base_url: https://cms-auth.amrithnath.dev
  auth_methods: [oauth]
  commit_messages:
    create: 'docs({{collection}}): 📝 create {{slug}}'
    update: 'docs({{collection}}): 📝 update {{slug}}'
    delete: 'docs({{collection}}): 📝 delete {{slug}}'
    uploadMedia: 'docs(cms): 📝 upload {{path}}'
    deleteMedia: 'docs(cms): 📝 delete {{path}}'

publish_mode: editorial_workflow
site_url: https://amrithnath.dev
display_url: https://amrithnath.dev
media_folder: public/images/blog
public_folder: /images/blog

collections:
  - name: blog
    label: Blog
    label_singular: Post
    folder: src/content/blog
    extension: md
    format: frontmatter
    create: true
    slug: '{{slug}}'
    preview_path: blog/{{slug}}/
    summary: '{{title}} ({{pubDate}})'
    sortable_fields:
      fields: [pubDate, title]
      default: { field: pubDate, direction: descending }
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: Description, widget: text }
      - name: pubDate
        label: Published
        widget: datetime
        format: YYYY-MM-DD
        time_format: false
        default: '{{now}}'
      - name: updatedDate
        label: Updated
        widget: datetime
        format: YYYY-MM-DD
        time_format: false
        required: false
      - { name: tags, label: Tags, widget: list, required: false, default: [] }
      - { name: draft, label: Hide on site (draft), widget: boolean, default: false, required: false }
      - { name: img, label: Cover image, widget: image, required: false }
      - { name: project, label: Related project, widget: relation, collection: projects, search_fields: [title], value_field: '{{slug}}', display_fields: [title], required: false }
      - { name: lang, label: Language code, widget: string, required: false }
      - { name: body, label: Body, widget: markdown }

  - name: projects
    label: Projects
    label_singular: Project
    folder: src/content/projects
    extension: md
    format: frontmatter
    create: true
    slug: '{{slug}}'
    identifier_field: title
    preview_path: project/{{slug}}/
    summary: '{{title}} ({{pubDate}})'
    sortable_fields:
      fields: [pubDate, title]
      default: { field: pubDate, direction: descending }
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: Description, widget: text }
      - name: pubDate
        label: Published
        widget: datetime
        format: YYYY-MM-DD
        time_format: false
        default: '{{now}}'
      - name: updatedDate
        label: Updated
        widget: datetime
        format: YYYY-MM-DD
        time_format: false
        required: false
      - { name: tags, label: Tags, widget: list, required: false, default: [] }
      - { name: tech, label: Technologies, widget: list, required: false }
      - { name: status, label: Status, widget: select, options: [active, maintained, archived, concept], required: false }
      - { name: featured, label: Featured, widget: boolean, default: false, required: false }
      - { name: draft, label: Hide on site (draft), widget: boolean, default: false, required: false }
      - { name: img, label: Cover image, widget: image, required: false }
      - { name: image, label: Alternate cover image, widget: image, required: false }
      - { name: lang, label: Language code, widget: string, required: false }
      - { name: link, label: Project link, widget: string, required: false }
      - { name: client, label: Client, widget: string, required: false }
      - { name: github, label: GitHub URL, widget: string, required: false }
      - { name: live, label: Live URL, widget: string, required: false }
      - { name: demo, label: Demo URL, widget: string, required: false }
      - { name: body, label: Body, widget: markdown }

  # Unlisted gallery at /photography/ (not linked from the site). Images are committed to
  # src/assets/photos; Astro serves resized AVIF/WebP copies without metadata, but the originals
  # are public in the repo, so export without GPS/location data (pnpm check:photos enforces it).
  - name: photos
    label: Photography
    label_singular: Photo
    folder: src/content/photos
    extension: yml
    format: yaml
    create: true
    slug: '{{slug}}'
    identifier_field: title
    media_folder: /src/assets/photos
    public_folder: ../../assets/photos
    preview_path: photography/
    summary: '{{title}}'
    sortable_fields:
      fields: [date, title]
      default: { field: date, direction: descending }
    fields:
      - { name: title, label: Title, widget: string }
      - { name: image, label: Local photo (leave empty for R2), widget: image, choose_url: false, required: false }
      - { name: alt, label: Alt text (describe the photo), widget: text }
      - { name: caption, label: Caption, widget: text, required: false }
      - name: remote
        label: R2 source (managed by ingest; do not combine with local photo)
        widget: object
        required: false
        fields:
          - { name: key, widget: hidden }
          - { name: width, widget: hidden }
          - { name: height, widget: hidden }
          - { name: placeholder, widget: hidden, required: false }
      - name: location
        label: Approximate location
        widget: object
        required: false
        hint: Paste a Google Maps link to the town or landmark (not your exact spot). Name, region, country and rounded coordinates are filled in automatically, and the link is then removed.
        fields:
          - { name: maps, label: Google Maps link, widget: string, required: false, pattern: ['^https://(www\.|maps\.)?(google\.[a-z.]+|app\.goo\.gl|goo\.gl)/', 'Use a Google Maps link'] }
          - { name: name, label: Place name, widget: string, required: false }
          - { name: region, label: Region, widget: string, required: false }
          - { name: country, label: Country, widget: string, required: false }
          - { name: lat, label: Latitude (at most 2 decimals), widget: number, value_type: float, min: -90, max: 90, step: 0.01, required: false }
          - { name: lng, label: Longitude (at most 2 decimals), widget: number, value_type: float, min: -180, max: 180, step: 0.01, required: false }
      - name: albums
        label: Albums and trips
        widget: relation
        collection: albums
        search_fields: [title]
        value_field: '{{slug}}'
        display_fields: [title]
        multiple: true
        required: false
        default: []
      - name: date
        label: Taken
        widget: datetime
        format: YYYY-MM-DD
        time_format: false
        required: false
      - { name: camera, label: Camera, widget: string, required: false }
      - { name: lens, label: Lens, widget: string, required: false }
      - { name: settings, label: Settings (e.g. 35mm · f/1.8 · 1/250s · ISO 100), widget: string, required: false }
      - { name: tags, label: Tags, widget: list, required: false, default: [] }
      - { name: featured, label: Featured (shown first), widget: boolean, default: false, required: false }
      - { name: draft, label: Hide on site (draft), widget: boolean, default: false, required: false }

  - name: albums
    label: Albums and trips
    folder: src/content/albums
    extension: yml
    format: yaml
    create: true
    slug: '{{slug}}'
    identifier_field: title
    preview_path: photography/albums/{{slug}}/
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: Description, widget: text, required: false }
      - { name: kind, label: Kind, widget: select, options: [album, trip], default: album }
      - name: cover
        label: Cover photo
        widget: relation
        collection: photos
        search_fields: [title]
        value_field: '{{slug}}'
        display_fields: [title]
        required: false
      - { name: startDate, label: Start date, widget: datetime, format: YYYY-MM-DD, time_format: false, required: false }
      - { name: endDate, label: End date, widget: datetime, format: YYYY-MM-DD, time_format: false, required: false }
      - name: stops
        label: Ordered itinerary
        widget: list
        required: false
        fields:
          - { name: name, label: Place name, widget: string }
          - { name: country, label: Country, widget: string }
          - { name: region, label: Region, widget: string, required: false }
          - { name: date, label: Date, widget: datetime, format: YYYY-MM-DD, time_format: false, required: false }
      - { name: draft, label: Hide on site (draft), widget: boolean, default: false, required: false }
  - name: pages
    label: Pages
    files:
      - name: now
        label: Now (unlisted)
        file: src/content/now/now.md
        format: frontmatter
        preview_path: now/
        fields:
          - name: updated
            label: Updated
            widget: datetime
            format: YYYY-MM-DD
            time_format: false
            default: '{{now}}'
          - { name: location, label: Where I am, widget: string, required: false }
          - { name: placeholder, label: Still placeholder text, widget: boolean, default: false, required: false }
          - { name: body, label: Now, widget: markdown }
