packages:
  - .

# pnpm 12+
allowBuilds:
  pagefind: true
  esbuild: true
  sharp: true
  workerd: true

# pnpm 9/10 (e.g. Vercel's built-in pnpm when Corepack is disabled)
onlyBuiltDependencies:
  - pagefind
  - esbuild
  - sharp
  - workerd

# Version pinning lives in package.json packageManager; keep the lockfile single-document for pnpm 9/10.
pmOnFail: ignore
